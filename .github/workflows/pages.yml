name: Deploy Pokemon Driftbound

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild base game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat deploy/Pokemon_Driftbound_v86.zip.part-* > /tmp/driftbound.zip
          unzip -q /tmp/driftbound.zip -d _site
          if [ -d updates ]; then
            cp -a updates/. _site/
          fi
          python3 deploy/apply_v89.py _site
          node --check _site/game.js
          node --check _site/movement_patch.js
          node --check _site/classic_world_patch.js
          node --check _site/classic_region_part1.js
          node --check _site/classic_region_part2.js
          node --check _site/classic_region_part3.js
          node --check _site/classic_region_part4.js
          node --check _site/classic_region_part5.js
          node --check _site/v91_world_patch.js
          node --check _site/v91_gameplay_patch.js
          touch _site/.nojekyll
          test -f _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
