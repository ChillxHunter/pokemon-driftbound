name: Deploy Pokemon Driftbound v121 Visual Reset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: driftbound-v121-visual-reset
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild v121 site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat deploy/Pokemon_Driftbound_v86.zip.part-* > /tmp/driftbound.zip
          unzip -q /tmp/driftbound.zip -d _site
          if [ -d updates ]; then cp -a updates/. _site/; fi
          python3 deploy/apply_v89.py _site
          python3 deploy/apply_v92.py _site
          python3 deploy/apply_v93.py _site
          python3 deploy/apply_v94.py _site
          python3 deploy/apply_v95.py _site
          python3 deploy/apply_v96.py _site
          python3 deploy/apply_v97.py _site
          python3 deploy/apply_v105.py _site
          python3 deploy/apply_v106.py _site
          python3 deploy/apply_v107.py _site
          python3 deploy/apply_v114.py _site
          python3 deploy/apply_v115.py _site
          python3 deploy/apply_v116.py _site
          python3 deploy/apply_v117.py _site
          python3 deploy/apply_v118.py _site
          python3 deploy/apply_v119.py _site
          python3 deploy/apply_v120.py _site
          python3 deploy/apply_v121.py _site

          node --check _site/game.js
          node --check _site/classic_region_part2.js
          node --check _site/v116_interiors.js
          node --check _site/v116_trainer_battle.js
          node --check _site/v118_mobile_ui.js
          node --check _site/v121_battle_reset.js
          node --check _site/v121_world_reset.js
          python3 -m py_compile deploy/apply_v116.py deploy/apply_v117.py deploy/apply_v118.py deploy/apply_v119.py deploy/apply_v120.py deploy/apply_v121.py

          # v121 four-command battle flow: FIGHT / BAG / POKEMON / RUN.
          grep -q "game.js?v=battle-121" _site/index.html
          grep -q "v121_battle_reset.css?v=battle-reset-121" _site/index.html
          grep -q "v121_battle_reset.js?v=battle-reset-121" _site/index.html
          grep -q 'id="v121FightButton"' _site/v121_battle_reset.js
          grep -q 'id="battleBagButton"' _site/v121_battle_reset.js
          grep -q 'id="pokemonButton"' _site/v121_battle_reset.js
          grep -q 'id="runButton"' _site/v121_battle_reset.js
          grep -q 'v121BattleFightMenu' _site/v121_battle_reset.js

          # v121 retires the failed v119/v120 giant-tree overlays.
          ! grep -q "v119_living_world.js?v=" _site/index.html
          ! grep -q "v120_world_foundation.js?v=" _site/index.html
          grep -q "v121_world_reset.css?v=world-reset-121" _site/index.html
          grep -q "v121_world_reset.js?v=world-reset-121" _site/index.html
          grep -q "V121_Mainland" _site/v121_world_reset.js
          grep -q "V121_NaturalTree" _site/v121_world_reset.js
          grep -q "V121_FieldGrass" _site/v121_world_reset.js
          grep -q "V121_WORLD_RESET_READY" _site/v121_world_reset.js
          grep -q "this.buildKey=''" _site/v121_world_reset.js

          # Gameplay progression, interiors, trainers and doors remain intact.
          grep -Fq "forestObstacleChance=areaId==='route2'?.32:.75" _site/classic_region_part2.js
          grep -q "v118_mobile_ui.js?v=118-fixes" _site/index.html
          grep -q "v116_trainers_runtime.js?v=116-final" _site/index.html
          grep -q "v116_world_visuals.js?v=116-final" _site/index.html
          grep -q "v116_doors.js?v=116-final" _site/index.html
          grep -q "v116_trainer_battle.js?v=116-final" _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-14
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
