name: Deploy Pokemon Driftbound v116 Clean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: driftbound-v116-clean
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild v116 site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat deploy/Pokemon_Driftbound_v86.zip.part-* > /tmp/driftbound.zip
          unzip -q /tmp/driftbound.zip -d _site
          if [ -d updates ]; then
            cp -a updates/. _site/
          fi
          python3 deploy/apply_v89.py _site
          python3 deploy/apply_v92.py _site
          python3 deploy/apply_v93.py _site
          python3 deploy/apply_v94.py _site
          python3 deploy/apply_v95.py _site
          python3 deploy/apply_v96.py _site
          python3 deploy/apply_v97.py _site
          python3 deploy/apply_v105.py _site
          python3 deploy/apply_v106.py _site
          python3 deploy/apply_v107.py _site
          python3 deploy/apply_v114.py _site
          python3 deploy/apply_v115.py _site
          python3 deploy/apply_v116.py _site

          node --check _site/game.js
          node --check _site/movement_patch.js
          node --check _site/classic_world_patch.js
          node --check _site/classic_region_part1.js
          node --check _site/classic_region_part2.js
          node --check _site/classic_region_part3.js
          node --check _site/classic_region_part4.js
          node --check _site/classic_region_part5.js
          node --check _site/v91_world_patch.js
          node --check _site/v91_gameplay_patch.js
          node --check _site/v92_world_patch.js
          node --check _site/v92_gameplay_patch.js
          node --check _site/v93_character_patch.js
          node --check _site/v94_mobile_controls.js
          node --check _site/v95_mobile_layout.js
          node --check _site/v96_gameboy_mobile.js
          node --check _site/v97_mobile_battle_fit.js
          node --check _site/v102_building_doors.js
          node --check _site/v115_movement_camera.js
          node --check _site/v115_world_rework.js
          node --check _site/v116_trainers_runtime.js
          node --check _site/v116_world_visuals.js
          node --check _site/v116_interiors.js
          node --check _site/v116_doors.js
          node --check _site/v116_trainer_battle.js
          for f in _site/v116_trainer_*.js; do node --check "$f"; done
          python3 -m py_compile deploy/apply_v116.py

          test -f _site/v107_mobile_battle_columns.css
          grep -q "v107_mobile_battle_columns.css" _site/index.html
          grep -q "v116_trainer_youngster.js?v=116-final" _site/index.html
          grep -q "v116_trainers_runtime.js?v=116-final" _site/index.html
          grep -q "v116_world_visuals.js?v=116-final" _site/index.html
          grep -q "v116_interiors.js?v=116-final" _site/index.html
          grep -q "v116_doors.js?v=116-final" _site/index.html
          grep -q "v116_trainer_battle.js?v=116-final" _site/index.html
          ! grep -q "v112_door_sequence.js?v=doors-112" _site/index.html
          ! grep -q "v114_movement_camera.js" _site/index.html
          ! grep -q "v113_global_camera.js" _site/index.html
          grep -q "__DRIFTBOUND_DISABLE_V102_AUTODOOR__" _site/v102_building_doors.js
          grep -q "__DRIFTBOUND_V116_DOOR_PRECHECK__" _site/v115_movement_camera.js
          grep -q "__DRIFTBOUND_TRAINERS_V116__" _site/v116_trainers_runtime.js
          grep -q "__DRIFTBOUND_V116_TRAINER_BATTLE__" _site/v116_trainer_battle.js
          grep -q "Pokémon" _site/game.js
          grep -q "Last Ball Used" _site/game.js
          grep -q "v116_trainer_scientist_part4.js?v=116-final" _site/index.html
          grep -q "v116_trainer_center_lady_part4.js?v=116-final" _site/index.html
          grep -q "v116_trainer_pack_3.js?v=116-final" _site/index.html
          grep -q "v116_trainer_battle.js?v=116-final" _site/index.html
          ! grep -q "v112_door_sequence.js" _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-14
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
